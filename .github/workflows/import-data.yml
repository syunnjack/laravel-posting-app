# 板(boards)を本番DBに投入する。手動実行のみ。
#
# 板はサイトの骨組みで、外部から取ってくる種類のデータではない。
# BoardSeeder は updateOrCreate なので、何度流しても重複しない。
# スレッドや書き込みには一切触れない。
name: Import board data

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload database files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './database/*'
          remote_path: '/home/xs501620/yorozu-bbs.jp/app/database/'
          sftp_only: true
          delete_remote_files: false

      - name: Seed boards over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/yorozu-bbs.jp/app
            PHP=$(command -v php8.3 || command -v php || echo /opt/php-8.3.30/bin/php)
            echo "php: $($PHP -v | head -1)"
            $PHP artisan migrate --force
            $PHP artisan db:seed --class=BoardSeeder --force
            $PHP artisan view:clear
            echo "--- 板の件数 ---"
            $PHP artisan tinker --execute="echo \App\Models\Board::count();"
